name: train_alarm
description: "GPS + live-train-status journey alerting app for Indian Railways."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Firebase (wired in Phase 2)
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3

  # Local DB (Phase 1)
  sqflite: ^2.4.2+1
  path: ^1.9.1

  # Location & Geofencing (Phase 3)
  geolocator: ^14.0.3
  geofence_service: ^6.0.0+1

  # Notifications & Alarm (Phase 3)
  flutter_local_notifications: ^22.0.1
  android_alarm_manager_plus: ^5.1.0

  # HTTP (Phase 4)
  dio: ^5.10.0

  # Serialization annotations (code-gen added in later phases)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/stations.db

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "../icon.png"
  android: true
  ios: false
  android_12:
    image: "../icon.png"
    color: "#FFFFFF"
